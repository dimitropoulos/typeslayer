[package]
name = "typeslayer"
version = "0.1.31"
description = "Slaying TypeScript types since 2026"
authors = ["Dimitri Mitropoulos"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "typeslayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
regex = "1"
tokio = { version = "1", features = [
  "fs",
  "macros",
  "process",
  "rt-multi-thread",
] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1.0.3"
chrono = { version = "0.4", features = ["clock"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-upload = "2"
tauri-plugin-screenshots = "2"
xcap = "0.8"
image = "0.25"
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "tokio",
  "tower-log",
] }
tower-http = { version = "0.6", default-features = false, features = ["cors"] }
base64 = "0.22"
dirs = "6"
libc = "0.2"
rmcp = { version = "0.16", features = ["server", "macros", "transport-io"] }
schemars = "1.2"
once_cell = "1.19"
zip = { version = "8.1.0", default-features = false, features = ["deflate"] }
strum = "0.27"
strum_macros = "0.27"
serde_plain = "1.0"
os_info = "3"
shell-escape = "0.1"
ts-rs = { version = "12.0.1", features = [
  "serde-compat",
  "chrono-impl",
  "indexmap-impl",
] }
nanoid = "0.4.0"
reqwest = { version = "0.13.2", features = ["json"] }
indexmap = { version = "2", features = ["std", "serde"] }
biome_console = "=0.5.7"
biome_deserialize = "=0.5.7"
biome_diagnostics = "=0.5.7"
biome_formatter = "=0.5.7"
biome_js_formatter = "=0.5.7"
biome_js_parser = "=0.5.7"
biome_js_syntax = "=0.5.7"
biome_json_parser = "=0.5.7"
biome_json_syntax = "=0.5.7"
biome_markup = "=0.5.7"
biome_parser = "=0.5.7"
biome_rowan = "=0.5.7"
biome_text_edit = "=0.5.7"
biome_text_size = "=0.5.7"
biome_unicode_table = "=0.5.7"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
serde_json = { version = "1", features = ["raw_value"] }
